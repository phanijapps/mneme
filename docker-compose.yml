name: mneme

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mneme
      POSTGRES_PASSWORD: mneme
      POSTGRES_DB: mneme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mneme -d mneme"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mneme:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mneme:mneme@postgres:5432/mneme?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    command: ["/out/mneme-api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  viz:
    image: mneme:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      VIZ_PORT: ":8090"
      MNEME_API_URL: http://api:8080
    ports:
      - "8090:8090"
    command: ["/out/mneme-viz"]
    restart: unless-stopped

volumes:
  pgdata:
